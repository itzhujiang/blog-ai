<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>手机号验证 - MUJI Aesthetic</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d4a573",
                        "background-light": "#f8f7f6",
                        "background-dark": "#1e1914",
                        "muji-off-white": "#F8F6F2",
                        "muji-brown": "#3E2723",
                        "muji-taupe": "#8b745b",
                        "muji-border": "#e3dcd4",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans SC", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .modal-backdrop {
            background-color: rgba(25, 21, 16, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop Overlay -->
<div class="fixed inset-0 modal-backdrop z-40 flex items-center justify-center p-6">
<!-- Modal Container -->
<div class="bg-muji-off-white dark:bg-background-dark w-full max-w-[420px] rounded-xl shadow-xl overflow-hidden relative border border-muji-border dark:border-primary/20">
<!-- Close Button -->
<button class="absolute top-4 right-4 text-muji-taupe hover:text-muji-brown dark:text-primary/60 dark:hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Modal Content -->
<div class="p-8 pt-10">
<!-- Header -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary/10 rounded-full mb-4">
<span class="material-symbols-outlined text-primary text-[28px]">phonelink_ring</span>
</div>
<h2 class="text-muji-brown dark:text-slate-100 text-2xl font-bold tracking-tight">手机号验证</h2>
<p class="text-muji-taupe dark:text-slate-400 text-sm mt-2">为了您的账户安全，请进行短信验证</p>
</div>
<!-- Form Section -->
<div class="space-y-5">
<!-- Phone Input Group -->
<div class="space-y-1.5">
<label class="text-muji-brown dark:text-slate-200 text-sm font-medium ml-1">手机号</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-muji-taupe dark:text-primary/60 material-symbols-outlined text-[20px]">smartphone</span>
<input class="w-full pl-11 pr-28 py-3.5 bg-white dark:bg-background-dark/50 border border-muji-border dark:border-primary/30 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-muji-brown dark:text-slate-100 placeholder:text-muji-taupe/50" placeholder="请输入手机号" type="tel"/>
<button class="absolute right-2 px-3 py-1.5 text-xs font-bold text-primary hover:bg-primary/5 rounded-md transition-colors border border-transparent hover:border-primary/20">
                                获取验证码
                            </button>
</div>
</div>
<!-- Verification Code Input Group -->
<div class="space-y-1.5">
<label class="text-muji-brown dark:text-slate-200 text-sm font-medium ml-1">验证码</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-muji-taupe dark:text-primary/60 material-symbols-outlined text-[20px]">shield_lock</span>
<input class="w-full pl-11 py-3.5 bg-white dark:bg-background-dark/50 border border-muji-border dark:border-primary/30 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-muji-brown dark:text-slate-100 tracking-[0.2em] placeholder:tracking-normal placeholder:text-muji-taupe/50" maxlength="6" placeholder="请输入6位验证码" type="text"/>
</div>
</div>
<!-- Confirm Button -->
<div class="pt-4">
<button class="w-full py-4 bg-primary hover:bg-primary/90 text-muji-brown font-bold rounded-lg shadow-sm shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>确认验证</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Footer Help -->
<div class="flex flex-col items-center gap-3 pt-4 border-t border-muji-border/50 dark:border-primary/10">
<a class="text-muji-taupe dark:text-primary/40 text-xs hover:text-primary dark:hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">help</span>
                            收不到验证码？
                        </a>
<p class="text-[10px] text-muji-taupe/60 text-center leading-relaxed max-w-[280px]">
                            点击确认即表示您同意我们的 <a class="underline" href="#">服务条款</a> 和 <a class="underline" href="#">隐私政策</a>
</p>
</div>
</div>
</div>
<!-- Subtle Decorative Bottom Edge (Wood Style Accent) -->
<div class="h-1.5 w-full bg-primary/20"></div>
</div>
</div>
<!-- Background Content Mockup (to show focus) -->
<div class="max-w-4xl w-full opacity-20 pointer-events-none select-none">
<nav class="flex justify-between items-center mb-12">
<div class="h-8 w-32 bg-muji-taupe/20 rounded"></div>
<div class="flex gap-6">
<div class="h-4 w-16 bg-muji-taupe/20 rounded"></div>
<div class="h-4 w-16 bg-muji-taupe/20 rounded"></div>
<div class="h-4 w-16 bg-muji-taupe/20 rounded"></div>
</div>
</nav>
<div class="space-y-6">
<div class="h-12 w-3/4 bg-muji-taupe/20 rounded"></div>
<div class="h-64 w-full bg-muji-taupe/10 rounded-xl"></div>
<div class="grid grid-cols-3 gap-6">
<div class="h-40 bg-muji-taupe/10 rounded-lg"></div>
<div class="h-40 bg-muji-taupe/10 rounded-lg"></div>
<div class="h-40 bg-muji-taupe/10 rounded-lg"></div>
</div>
</div>
</div>
</body></html>
